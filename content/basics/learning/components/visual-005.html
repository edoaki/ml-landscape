<div class="lf-demo">
<p class="lf-step"><span>1</span>少数の正解付き画像で、傷の分類を学ぶ</p>
<div class="lf-samples"><div class="lf-sample"><svg class="lf-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="傷のある製品"><rect x="6" y="6" width="228" height="138" rx="10" fill="#edf1f1"/><rect x="35" y="26" width="170" height="98" rx="18" fill="#d3dce0" stroke="#687e89" stroke-width="2"/><circle cx="54" cy="44" r="4" fill="#8c9da5"/><circle cx="186" cy="106" r="4" fill="#8c9da5"/><path d="M90 52 l13 15 -8 9 25 22 m-25 -29 l25 15" fill="none" stroke="#864c30" stroke-width="3" stroke-linecap="round"/></svg><span class="lf-tag ">人のラベル：傷あり</span></div><div class="lf-sample"><svg class="lf-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="傷のない製品"><rect x="6" y="6" width="228" height="138" rx="10" fill="#edf1f1"/><rect x="35" y="26" width="170" height="98" rx="18" fill="#d3dce0" stroke="#687e89" stroke-width="2"/><circle cx="54" cy="44" r="4" fill="#8c9da5"/><circle cx="186" cy="106" r="4" fill="#8c9da5"/></svg><span class="lf-tag ">人のラベル：傷なし</span></div></div>
<p>製品画像と人が付けたラベルを使い、最初の分類モデルを学習する。</p>
<p class="lf-step"><span>2</span>ラベルなし画像に、モデルで仮の答えを付ける</p>
<div class="lf-split"><div><div class="lf-sample"><svg class="lf-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="傷のある製品"><rect x="6" y="6" width="228" height="138" rx="10" fill="#edf1f1"/><rect x="35" y="26" width="170" height="98" rx="18" fill="#d3dce0" stroke="#687e89" stroke-width="2"/><circle cx="54" cy="44" r="4" fill="#8c9da5"/><circle cx="186" cy="106" r="4" fill="#8c9da5"/><path d="M98 52 l13 15 -8 9 25 22 m-25 -29 l25 15" fill="none" stroke="#864c30" stroke-width="3" stroke-linecap="round"/></svg><span class="lf-tag ">未ラベルの画像</span></div><p><strong>「傷あり」と強く予測</strong><br><span class="lf-tag lf-pseudo">疑似ラベル：傷あり</span></p></div><div><div class="lf-sample"><svg class="lf-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="傷のない製品"><rect x="6" y="6" width="228" height="138" rx="10" fill="#edf1f1"/><rect x="35" y="26" width="170" height="98" rx="18" fill="#d3dce0" stroke="#687e89" stroke-width="2"/><circle cx="54" cy="44" r="4" fill="#8c9da5"/><circle cx="186" cy="106" r="4" fill="#8c9da5"/></svg><span class="lf-tag ">未ラベルの画像</span></div><p><strong>「傷あり／なし」で迷う</strong><br><span class="lf-tag lf-muted">今回は採用しない</span></p></div></div>
<p class="lf-step"><span>3</span>人のラベルと、採用した疑似ラベルの両方で学ぶ</p>
<div class="lf-combine"><span class="lf-tag">人が付けた正解</span><b>＋</b><span class="lf-tag lf-pseudo">モデルが付けた仮の答え</span></div>
<p class="lf-takeaway">疑似ラベルは誤ることもある。仮の答えを採用する基準を決め、人が確認した別のデータで改善を確かめる。</p>
</div>
