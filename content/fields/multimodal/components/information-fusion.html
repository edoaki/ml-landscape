<div class="lesson-visual" role="group" aria-label="何を止めた？ 情報を組み合わせて絞り込む"><p class="lv-title">何を止めた？ 情報を組み合わせて絞り込む</p><div class="lv-grid lv-three"><div class="lv-card "><span class="lv-label">音声だけ</span><strong>「ここで止めます」</strong><p>火？ かき混ぜる手？<br>何を止めるかは、この発話だけでは決まらない。</p></div><div class="lv-card "><span class="lv-label">映像だけ</span><svg viewBox="0 0 300 145" role="img" aria-label="火がついている鍋"><rect x="35" y="100" width="230" height="25" rx="7" fill="#d6ddd6"/><path d="M105 36h90v38q0 12-45 12t-45-12Z" fill="#879b90"/><path d="M80 47h25m90 0h25" stroke="#536b60" stroke-width="8"/><path d="M120 99q-15-14 5-26 0 12 10 14 8 9-15 12m45 0q-15-14 5-26 0 12 10 14 8 9-15 12" fill="#ba7147"/></svg><div class="lv-down" aria-hidden="true">↓</div><svg viewBox="0 0 300 145" role="img" aria-label="火が消えた鍋"><rect x="35" y="100" width="230" height="25" rx="7" fill="#d6ddd6"/><path d="M105 36h90v38q0 12-45 12t-45-12Z" fill="#879b90"/><path d="M80 47h25m90 0h25" stroke="#536b60" stroke-width="8"/><path d="M112 97h76" stroke="#536b60" stroke-width="3"/></svg><p>火が消えたことは分かる。話し手が何を説明しているかは、音声なしでは確認できない。</p></div><div class="lv-card lv-selected"><span class="lv-label">映像 ＋ 音声</span><strong>火が消える動作<br>＋<br>「ここで止めます」</strong><span class="lv-answer">→ この場面では火を止めることを指す。</span><p>動作と発話を対応付けると、省略された対象を補える。</p></div></div><p class="lv-caption">架空の料理場面。統合は、各入力を並べるだけでなく、一方の情報で他方の曖昧さを減らすことを含みます。</p></div>
