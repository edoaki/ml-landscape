<figure class="dq-figure"><p class="dq-title">写真は同じ。間違っていたラベルを直す</p><div class="dq-grid"><div class="dq-panel"><h3>点検前</h3><svg viewBox="0 0 240 140" role="img" aria-label="傷のある製品"><rect x="0" y="0" width="240" height="140" rx="8" fill="#eef0eb"/><rect x="35" y="25" width="170" height="90" rx="13" fill="#c1ccc4" stroke="#70877a" stroke-width="2"/><path d="M132 51 L147 62 L137 73 L153 84" fill="none" stroke="#744c38" stroke-width="4"/></svg><p class="dq-answer dq-warn">記録：傷なし</p><p>注釈基準と照らすと、傷ありに該当。</p></div><div class="dq-panel"><h3>修正後</h3><svg viewBox="0 0 240 140" role="img" aria-label="傷のある製品"><rect x="0" y="0" width="240" height="140" rx="8" fill="#eef0eb"/><rect x="35" y="25" width="170" height="90" rx="13" fill="#c1ccc4" stroke="#70877a" stroke-width="2"/><path d="M132 51 L147 62 L137 73 L153 84" fill="none" stroke="#744c38" stroke-width="4"/></svg><p class="dq-answer">記録：傷あり</p><p>確認者と修正理由を残し、学習し直す。</p></div></div><p class="dq-intro">データv1 → ラベル修正 → データv2。同じモデル構造・学習設定で、別に確保した評価データへの影響を比べる。</p><figcaption>教材用の模式例。モデルとラベルが違うという理由だけで修正せず、画像と注釈基準を確認します。データを直せば必ず性能が上がる、という結果を示した図ではありません。</figcaption></figure>
