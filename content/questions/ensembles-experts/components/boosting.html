<figure class="ensemble-figure"><div class="figure-scroll"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 505" role="img" aria-labelledby="boosting-title"><title id="boosting-title">70人の予測に20人の補正を加え90人になる棒グラフ</title><defs><marker id="boosting-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#9caca6" stroke-width="1.2"/></marker></defs><g font-family="-apple-system, BlinkMacSystemFont, sans-serif"><text x="28" y="34" font-size="12" fill="#267668" text-anchor="start" font-weight="700">03 / 順に補正する</text><text x="28" y="67" font-size="24" fill="#243d3b" text-anchor="start" font-weight="650">残った誤差を、次のモデルが補う</text><text x="28" y="94" font-size="15" fill="#6c7b7a" text-anchor="start" font-weight="400">勾配ブースティング：来客数を予測する例</text><text x="28" y="137" font-size="14" fill="#267668" text-anchor="start" font-weight="650">学習時</text><text x="130" y="137" font-size="16" fill="#243d3b" text-anchor="start" font-weight="400">正解は100人</text><path d="M113 330.0 L723 330.0" fill="none" stroke="#c7d2cc" stroke-width="1" stroke-dasharray="5 5"/><text x="96" y="335.0" font-size="14" fill="#6c7b7a" text-anchor="end" font-weight="400">0</text><path d="M113 175.0 L723 175.0" fill="none" stroke="#c7d2cc" stroke-width="1" stroke-dasharray="5 5"/><text x="96" y="180.0" font-size="14" fill="#6c7b7a" text-anchor="end" font-weight="400">100</text><rect x="154" y="221.5" width="105" height="108.5" rx="3" fill="#267668" stroke="none"/><text x="206" y="207.5" font-size="25" fill="#267668" text-anchor="middle" font-weight="650">70人</text><rect x="559" y="190.5" width="105" height="139.5" rx="3" fill="#267668" stroke="none"/><text x="611" y="176.5" font-size="25" fill="#267668" text-anchor="middle" font-weight="650">90人</text><rect x="154" y="175" width="105" height="46.5" rx="2" fill="#faecd9" stroke="none"/><text x="206" y="281" font-size="25" fill="white" text-anchor="middle" font-weight="650">70人</text><text x="281" y="235" font-size="17" fill="#b97730" text-anchor="start" font-weight="600">残差 30人</text><path d="M265 175 L265 221" fill="none" stroke="#b97730" stroke-width="2"/><rect x="354" y="190.5" width="105" height="31.0" rx="3" fill="#b97730" stroke="none"/><text x="406" y="176.5" font-size="24" fill="#b97730" text-anchor="middle" font-weight="650">＋20人</text><path d="M277 282 H327" fill="none" stroke="#9caca6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boosting-arrow)"/><path d="M477 282 H532" fill="none" stroke="#9caca6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boosting-arrow)"/><text x="207" y="358" font-size="16" fill="#243d3b" text-anchor="middle" font-weight="400">現在の予測</text><text x="407" y="358" font-size="16" fill="#243d3b" text-anchor="middle" font-weight="400">学んだ補正</text><text x="612" y="358" font-size="16" fill="#243d3b" text-anchor="middle" font-weight="400">更新後の予測</text><rect x="28" y="390" width="704" height="53" rx="12" fill="#f5f7f6" stroke="none"/><text x="48" y="423" font-size="16" fill="#243d3b" text-anchor="start" font-weight="400">残差30人を目標に学び、この例では＋20人を補正。残差は10人に。</text><text x="28" y="479" font-size="17" fill="#267668" text-anchor="start" font-weight="400">利用時は、学習済みモデルの出力を足し合わせる。</text></g></svg></div><figcaption>二乗誤差による回帰の数値例。補正の係数は1としています。</figcaption></figure>
