<figure id="fig-fairness-rates"><div class="figure-scroll" tabindex="0" role="region" aria-label="推薦率は両集団40%だが再現率は90%と60%（横にスクロールできます）"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" role="img" aria-label="推薦率は両集団40%だが再現率は90%と60%" style="font-family:system-ui,sans-serif"><title>推薦率は両集団40%だが再現率は90%と60%</title><text x="26" y="34" font-size="20" fill="#243b30" >同じ200人の結果でも、分母を変えると見える差が変わる</text><rect x="24" y="61" width="335" height="278" rx="8" fill="#f3f5ef" stroke="none"/><text x="38" y="91" font-size="16" fill="#243b30" >全員のうち、推薦を受けた割合</text><text x="38" y="119" font-size="14" fill="#243b30" >分母：各集団の100人</text><text x="38" y="175" font-size="18" fill="#35664d" >A</text><rect x="67" y="157" width="200" height="23" rx="8" fill="#dfe5da" stroke="none"/><rect x="67" y="157" width="80.0" height="23" rx="8" fill="#35664d" stroke="none"/><text x="277" y="176" font-size="20" fill="#35664d" >40%</text><text x="67" y="205" font-size="15" fill="#243b30" >40 / 100人</text><text x="38" y="253" font-size="18" fill="#356d9a" >B</text><rect x="67" y="235" width="200" height="23" rx="8" fill="#dfe5da" stroke="none"/><rect x="67" y="235" width="80.0" height="23" rx="8" fill="#356d9a" stroke="none"/><text x="277" y="254" font-size="20" fill="#356d9a" >40%</text><text x="67" y="283" font-size="15" fill="#243b30" >40 / 100人</text><text x="67" y="321" font-size="12" fill="#243b30" >0%</text><text x="237" y="321" font-size="12" fill="#243b30" >100%</text><rect x="401" y="61" width="335" height="278" rx="8" fill="#f3f5ef" stroke="none"/><text x="415" y="91" font-size="16" fill="#243b30" >必要な人のうち、推薦を受けた割合</text><text x="415" y="119" font-size="14" fill="#243b30" >分母：復習が必要な人だけ</text><text x="415" y="175" font-size="18" fill="#35664d" >A</text><rect x="444" y="157" width="200" height="23" rx="8" fill="#dfe5da" stroke="none"/><rect x="444" y="157" width="180.0" height="23" rx="8" fill="#35664d" stroke="none"/><text x="654" y="176" font-size="20" fill="#35664d" >90%</text><text x="444" y="205" font-size="15" fill="#243b30" >36 / 40人</text><text x="415" y="253" font-size="18" fill="#356d9a" >B</text><rect x="444" y="235" width="200" height="23" rx="8" fill="#dfe5da" stroke="none"/><rect x="444" y="235" width="120.0" height="23" rx="8" fill="#356d9a" stroke="none"/><text x="654" y="254" font-size="20" fill="#356d9a" >60%</text><text x="444" y="283" font-size="15" fill="#243b30" >12 / 20人</text><text x="444" y="321" font-size="12" fill="#243b30" >0%</text><text x="614" y="321" font-size="12" fill="#243b30" >100%</text><text x="24" y="378" font-size="19" fill="#35664d" >推薦率：AもBも40%</text><text x="401" y="378" font-size="19" fill="#356d9a" >再現率：Aは90%、Bは60%</text></svg></div><figcaption>本文の人数表から計算した架空の例。各バーの最大値は100%です。左は推薦機会の割合、右は必要な人への到達率を比較しています。</figcaption></figure>
