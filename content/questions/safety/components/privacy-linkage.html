<figure id="fig-privacy-linkage"><div class="figure-scroll" tabindex="0" role="region" aria-label="匿名の履歴と公開された履修科目の照合（横にスクロールできます）"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 405" role="img" aria-label="匿名の履歴と公開された履修科目の照合" style="font-family:system-ui,sans-serif"><title>匿名の履歴と公開された履修科目の照合</title><text x="26" y="34" font-size="20" fill="#243b30" >氏名を消しても、履修科目の組合せが照合の手がかりになる</text><rect x="24" y="65" width="712" height="156" rx="8" fill="#f3f5ef" stroke="none"/><text x="42" y="93" font-size="18" fill="#243b30" >公開された匿名の学習記録</text><text x="42" y="123" font-size="15" fill="#243b30" >ID</text><text x="135" y="123" font-size="15" fill="#243b30" >受講科目</text><text x="495" y="123" font-size="15" fill="#243b30" >小テストの記録</text><rect x="36" y="134" width="688" height="32" rx="8" fill="#e3edf4" stroke="none"/><text x="42" y="156" font-size="15" fill="#243b30" >u17</text><text x="135" y="156" font-size="15" fill="#243b30" >古典ギリシャ語 ＋ 天文学</text><text x="495" y="156" font-size="15" fill="#243b30" >分数の計算で誤答が多い</text><text x="42" y="194" font-size="15" fill="#243b30" >u18</text><text x="135" y="194" font-size="15" fill="#243b30" >英語 ＋ 統計学</text><text x="495" y="194" font-size="15" fill="#243b30" >分数の計算は正答</text><rect x="24" y="253" width="335" height="124" rx="8" fill="#e3edf4" stroke="none"/><text x="40" y="283" font-size="17" fill="#356d9a" >本人が別の場所で公開した情報</text><text x="40" y="320" font-size="17" fill="#243b30" >「今期は古典ギリシャ語と</text><text x="40" y="347" font-size="17" fill="#243b30" >天文学を履修しています」</text><text x="372" y="325" font-size="24" fill="#356d9a" >→</text><rect x="405" y="253" width="331" height="124" rx="8" fill="#fbefe7" stroke="none"/><text x="421" y="283" font-size="17" fill="#ac592f" >組合せが一人に絞られると…</text><text x="421" y="320" font-size="18" fill="#243b30" >u17が誰かを推測できる</text><text x="421" y="347" font-size="18" fill="#243b30" >苦手分野まで結び付く</text></svg></div><figcaption>すべて架空の記録です。この例は、照合できる相手の情報があり、科目の組合せから対象を絞れる場合を示します。氏名の削除だけで再識別を防げるとは限りません。</figcaption></figure>
