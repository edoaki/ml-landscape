<figure id="fig-safety-path"><div class="figure-scroll" tabindex="0" role="region" aria-label="誤った入力から害に至る三段階と、それぞれの対策（横にスクロールできます）"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" role="img" aria-label="誤った入力から害に至る三段階と、それぞれの対策" style="font-family:system-ui,sans-serif"><title>誤った入力から害に至る三段階と、それぞれの対策</title><text x="26" y="34" font-size="20" fill="#243b30" >予測の間違いが、どのように学習機会の喪失につながるか</text><rect x="24" y="70" width="212" height="130" rx="8" fill="#fbefE7" stroke="none"/><text x="40" y="98" font-size="18" fill="#ac592f" >入力の取り違え</text><text x="40" y="137" font-size="16" fill="#243b30" >未回答をすべて誤答扱い</text><text x="40" y="165" font-size="16" fill="#243b30" >通信切断を見落とす</text><text x="244" y="142" font-size="24" fill="#ac592f" >→</text><line x1="130" y1="214" x2="130" y2="244" stroke="#35664d" stroke-width="2" /><text x="130" y="232" font-size="21" fill="#35664d" text-anchor="middle">×</text><rect x="274" y="70" width="212" height="130" rx="8" fill="#fbefE7" stroke="none"/><text x="290" y="98" font-size="18" fill="#ac592f" >推薦の誤り</text><text x="290" y="137" font-size="16" fill="#243b30" >基礎が不足と判定</text><text x="290" y="165" font-size="16" fill="#243b30" >不要な復習を勧める</text><text x="494" y="142" font-size="24" fill="#ac592f" >→</text><line x1="380" y1="214" x2="380" y2="244" stroke="#35664d" stroke-width="2" /><text x="380" y="232" font-size="21" fill="#35664d" text-anchor="middle">×</text><rect x="524" y="70" width="212" height="130" rx="8" fill="#fbefE7" stroke="none"/><text x="540" y="98" font-size="18" fill="#ac592f" >運用で生じる害</text><text x="540" y="137" font-size="16" fill="#243b30" >復習を終えるまで</text><text x="540" y="165" font-size="16" fill="#243b30" >次の教材を開けない</text><line x1="630" y1="214" x2="630" y2="244" stroke="#35664d" stroke-width="2" /><text x="630" y="232" font-size="21" fill="#35664d" text-anchor="middle">×</text><rect x="24" y="255" width="212" height="124" rx="8" fill="#eef3e7" stroke="none"/><text x="38" y="284" font-size="17" fill="#35664d" >入力を確かめる</text><text x="38" y="320" font-size="16" fill="#243b30" >欠測と誤答を分ける</text><text x="38" y="347" font-size="16" fill="#243b30" >理由が不明なら保留</text><rect x="274" y="255" width="212" height="124" rx="8" fill="#eef3e7" stroke="none"/><text x="288" y="284" font-size="17" fill="#35664d" >推薦を確認・訂正する</text><text x="288" y="320" font-size="16" fill="#243b30" >学生が誤判定を伝える</text><text x="288" y="347" font-size="16" fill="#243b30" >教員が履歴を確認する</text><rect x="524" y="255" width="212" height="124" rx="8" fill="#eef3e7" stroke="none"/><text x="538" y="284" font-size="17" fill="#35664d" >行動の範囲を制限する</text><text x="538" y="320" font-size="16" fill="#243b30" >自動で履修制限しない</text><text x="538" y="347" font-size="16" fill="#243b30" >確認中も教材を使える</text><text x="26" y="412" font-size="17" fill="#243b30" >「何を予測するか」に加えて、「予測を何に使うか」が影響を決める。</text></svg></div><figcaption>教材推薦の架空の失敗例。上段は失敗が伝わる経路、下段は各段階の対策です。対策を設けた後も、止められなかった失敗と不要な保留を評価します。</figcaption></figure>
