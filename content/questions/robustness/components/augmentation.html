<figure><div class="figure-scroll"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-label="データ拡張ではラベルの根拠となる傷を残す" style="font-family:system-ui,sans-serif"><title>データ拡張ではラベルの根拠となる傷を残す</title><text x="25" y="32" font-size="20" fill="#243b30">データ拡張：見え方を変えても、正解の根拠を残す</text><text x="35" y="74" font-size="17" fill="#243b30">元画像</text><rect x="35" y="90" width="180" height="115" rx="8" fill="#e9ece8" stroke="none"/><rect x="80" y="108" width="90" height="78" rx="8" fill="#b9c5c8" stroke="none"/><path d="M107 126 l17 13 -9 10 22 19" fill="none" stroke="#283e46" stroke-width="3"/><text x="275" y="74" font-size="17" fill="#243b30">明るさの変更</text><rect x="275" y="90" width="180" height="115" rx="8" fill="#e9ece8" stroke="none"/><rect x="320" y="108" width="90" height="78" rx="8" fill="#717d80" stroke="none"/><path d="M347 126 l17 13 -9 10 22 19" fill="none" stroke="#283e46" stroke-width="3"/><text x="515" y="74" font-size="17" fill="#243b30">強すぎるぼけ</text><rect x="515" y="90" width="180" height="115" rx="8" fill="#e9ece8" stroke="none"/><rect x="560" y="108" width="90" height="78" rx="8" fill="#b9c5c8" stroke="none"/><path d="M587 126 l17 13 -9 10 22 19" fill="none" stroke="#b5bfc0" stroke-width="3"/><text x="35" y="242" font-size="17" fill="#243b30">傷が見える</text><text x="275" y="242" font-size="17" fill="#243b30">傷が残る変更を使う</text><text x="515" y="242" font-size="17" fill="#a15a37">傷が判別しにくい</text><text x="35" y="283" font-size="17" fill="#243b30">傷を消すほど変えると、「傷あり」の教師ラベルが曖昧になる。</text></svg></div><figcaption>教材用の模式図。右はぼけで傷のコントラストが失われる様子を簡略化しています。実際に許容できる変更の強さは、検出したい傷の大きさや撮影条件によって変わります。</figcaption></figure>
