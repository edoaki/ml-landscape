<figure><div class="figure-scroll"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 314" role="img" aria-label="明るい条件100%、暗い条件50%、全体95%という架空の評価例" style="font-family:system-ui,sans-serif"><title>明るい条件100%、暗い条件50%、全体95%という架空の評価例</title><text x="25" y="32" font-size="20" fill="#243b30">平均95%でも、暗い条件では正解率が50%ということも</text><text x="25" y="101" font-size="17" fill="#243b30">明るい条件</text><rect x="155" y="82" width="300" height="26" rx="8" fill="#edf0e9" stroke="none"/><rect x="155" y="82" width="300" height="26" rx="8" fill="#477a63" stroke="none"/><text x="470" y="102" font-size="19" fill="#243b30">100%</text><text x="545" y="101" font-size="14" fill="#243b30">90枚中90枚に正解</text><text x="25" y="173" font-size="17" fill="#243b30">暗い条件</text><rect x="155" y="154" width="300" height="26" rx="8" fill="#edf0e9" stroke="none"/><rect x="155" y="154" width="150" height="26" rx="8" fill="#ba7147" stroke="none"/><text x="470" y="174" font-size="19" fill="#243b30">50%</text><text x="545" y="173" font-size="14" fill="#243b30">10枚中5枚に正解</text><text x="25" y="245" font-size="17" fill="#243b30">全体</text><rect x="155" y="226" width="300" height="26" rx="8" fill="#edf0e9" stroke="none"/><rect x="155" y="226" width="285" height="26" rx="8" fill="#4d7897" stroke="none"/><text x="470" y="246" font-size="19" fill="#243b30">95%</text><text x="545" y="245" font-size="14" fill="#243b30">100枚中95枚に正解</text><text x="155" y="288" font-size="13" fill="#243b30">0</text><text x="425" y="288" font-size="13" fill="#243b30">100%（正解率）</text></svg></div><figcaption>説明用の架空の数値。明るい写真が多いため、全体では95%に見えます。条件別に分けると暗い条件は50%で、改善すべき弱点が見つかります。実モデルの測定結果ではありません。</figcaption></figure>
