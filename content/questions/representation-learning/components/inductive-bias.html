<div class="rep-cards"><div class="rep-card"><h3>訓練例だけでは決まらない</h3><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 222" role="img" aria-label="中央の5を正しく答えられるだけでは規則を特定できない"><text x="6" y="20" font-size="16" style="fill:#243b30">見た例：中央にある5</text><rect x="7" y="33" width="132" height="82" rx="5" fill="#f7f8f3" stroke="#b7c8b3"/><image href="content/questions/representation-learning/media/mnist-five.png" x="53" y="54" width="40" height="40"/><rect x="177" y="33" width="132" height="82" rx="5" fill="#f7f8f3" stroke="#b7c8b3"/><image href="content/questions/representation-learning/media/mnist-five.png" x="223" y="54" width="40" height="40"/><text x="40" y="140" font-size="14" style="fill:#243b30">正解「5」</text><text x="210" y="140" font-size="14" style="fill:#243b30">正解「5」</text><text x="8" y="183" font-size="14" style="fill:#243b30">形でも、位置でも説明できてしまう</text></svg><p>見た例に合う規則は一つとは限りません。</p></div><div class="rep-card"><h3>どんな規則を選びやすくするか</h3><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 222" role="img" aria-label="右側に移した5では形に基づく規則と位置に基づく規則の答えが異なる"><text x="7" y="20" font-size="16" style="fill:#243b30">まだ見ていない例：右側の5</text><rect x="87" y="33" width="132" height="82" rx="5" fill="#f7f8f3" stroke="#b7c8b3"/><image href="content/questions/representation-learning/media/mnist-five.png" x="172" y="54" width="40" height="40"/><path d="M120 125 L120 148" stroke="#708771" fill="none" stroke-width="2"/><polygon points="120,148 116,141 124,141" fill="#708771"/><path d="M195 125 L195 148" stroke="#708771" fill="none" stroke-width="2"/><polygon points="195,148 191,141 199,141" fill="#708771"/><text x="4" y="172" font-size="14" style="fill:#243b30">形を使う規則</text><text x="174" y="172" font-size="14" style="fill:#243b30">中央だけの規則</text><text x="24" y="204" font-size="21" style="fill:#243b30">「5」</text><text x="186" y="204" font-size="21" style="fill:#243b30">「5以外」</text></svg><p>同じ形を別の場所でも見つけやすい構造が、判断を広げる手がかりになります。</p></div></div>
