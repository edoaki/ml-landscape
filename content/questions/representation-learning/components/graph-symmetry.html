<div class="rep-cards"><div class="rep-card"><h3>全体の予測は不変</h3><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-label="同じグラフなら点の入力順序によらず全体の予測値は同じ"><path d="M45 56 L155 56 L265 56" stroke="#708771" stroke-width="3"/><circle cx="45" cy="56" r="20" fill="#e5eddf" stroke="#819777"/><text x="39" y="62" font-size="18" style="fill:#243b30">A</text><circle cx="155" cy="56" r="20" fill="#e5eddf" stroke="#819777"/><text x="149" y="62" font-size="18" style="fill:#243b30">B</text><circle cx="265" cy="56" r="20" fill="#e5eddf" stroke="#819777"/><text x="259" y="62" font-size="18" style="fill:#243b30">C</text><text x="7" y="110" font-size="14" style="fill:#243b30">入力の順序</text><text x="160" y="110" font-size="14" style="fill:#243b30">出力</text><text x="10" y="150" font-size="18" style="fill:#243b30">[A, B, C]</text><path d="M115 145 L149 145" stroke="#708771" fill="none" stroke-width="2"/><polygon points="149,145 142,141 142,149" fill="#708771"/><text x="172" y="150" font-size="16" style="fill:#243b30">ひとつの値</text><text x="10" y="205" font-size="18" style="fill:#243b30">[C, A, B]</text><path d="M115 200 L149 200" stroke="#708771" fill="none" stroke-width="2"/><polygon points="149,200 142,196 142,204" fill="#708771"/><text x="172" y="205" font-size="16" style="fill:#243b30">同じ値</text></svg><p>点の順序を変えても、全体としての予測値は変わりません。</p></div><div class="rep-card"><h3>点ごとの予測は同変</h3><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-label="点の入力順序を変えたら各点の予測値も対応して並べ替える"><path d="M45 56 L155 56 L265 56" stroke="#708771" stroke-width="3"/><circle cx="45" cy="56" r="20" fill="#e5eddf" stroke="#819777"/><text x="39" y="62" font-size="18" style="fill:#243b30">A</text><circle cx="155" cy="56" r="20" fill="#e5eddf" stroke="#819777"/><text x="149" y="62" font-size="18" style="fill:#243b30">B</text><circle cx="265" cy="56" r="20" fill="#e5eddf" stroke="#819777"/><text x="259" y="62" font-size="18" style="fill:#243b30">C</text><text x="7" y="110" font-size="14" style="fill:#243b30">入力の順序</text><text x="160" y="110" font-size="14" style="fill:#243b30">出力</text><text x="10" y="150" font-size="18" style="fill:#243b30">[A, B, C]</text><path d="M115 145 L149 145" stroke="#708771" fill="none" stroke-width="2"/><polygon points="149,145 142,141 142,149" fill="#708771"/><text x="156" y="150" font-size="16" style="fill:#243b30">[値A, 値B, 値C]</text><text x="10" y="205" font-size="18" style="fill:#243b30">[C, A, B]</text><path d="M115 200 L149 200" stroke="#708771" fill="none" stroke-width="2"/><polygon points="149,200 142,196 142,204" fill="#708771"/><text x="156" y="205" font-size="16" style="fill:#243b30">[値C, 値A, 値B]</text></svg><p>Aへの予測はAに、Bへの予測はBに対応するよう、出力の順序も変わります。</p></div></div>
