<figure class="exp-demo exp-abstention" aria-label="確信度を使った自動回答と保留の振り分け">
<p class="exp-title">確信度の低い写真を、人の確認へ回す</p>
<p>閾値は「自動で答えるために必要な確信度」です。<strong>閾値以上なら自動回答、下回れば保留</strong>にします。</p>
<div class="exp-controls" hidden><label>自動回答の閾値 <input class="exp-threshold" type="range" min="50" max="100" step="5" value="50"><output class="exp-threshold-value">50%</output></label><div class="unc-presets"><button type="button" data-threshold="50">50%：すべて答える</button><button type="button" data-threshold="80">80%：低い確信度を保留</button><button type="button" data-threshold="100">100%：すべて保留</button></div></div>
<p class="unc-rule">確信度50%以上 → 自動回答 ／ 50%未満 → 保留</p>
<div class="unc-metrics"><p>自動で答えた割合<strong class="unc-coverage">10 / 全10件 = 100%</strong></p><p>自動回答の中の誤り率<strong class="unc-risk">誤り4 / 自動回答10件 = 40%</strong></p></div>
<div class="unc-trays"><div class="unc-tray"><h3>自動で答える <span class="unc-accepted-count">10件</span></h3><div class="exp-cases unc-accepted"><div class="exp-case" data-confidence="0.99" data-correct="1"><strong>写真1</strong><span>確信度99%</span><div class="unc-confidence" aria-hidden="true"><i style="width:99%"></i></div><span class="unc-outcome">○ 正解</span><small class="exp-case-state">自動回答</small></div><div class="exp-case" data-confidence="0.97" data-correct="1"><strong>写真2</strong><span>確信度97%</span><div class="unc-confidence" aria-hidden="true"><i style="width:97%"></i></div><span class="unc-outcome">○ 正解</span><small class="exp-case-state">自動回答</small></div><div class="exp-case" data-confidence="0.95" data-correct="0"><strong>写真3</strong><span>確信度95%</span><div class="unc-confidence" aria-hidden="true"><i style="width:95%"></i></div><span class="unc-outcome">× 誤り</span><small class="exp-case-state">自動回答</small></div><div class="exp-case" data-confidence="0.9" data-correct="1"><strong>写真4</strong><span>確信度90%</span><div class="unc-confidence" aria-hidden="true"><i style="width:90%"></i></div><span class="unc-outcome">○ 正解</span><small class="exp-case-state">自動回答</small></div><div class="exp-case" data-confidence="0.85" data-correct="1"><strong>写真5</strong><span>確信度85%</span><div class="unc-confidence" aria-hidden="true"><i style="width:85%"></i></div><span class="unc-outcome">○ 正解</span><small class="exp-case-state">自動回答</small></div><div class="exp-case" data-confidence="0.8" data-correct="0"><strong>写真6</strong><span>確信度80%</span><div class="unc-confidence" aria-hidden="true"><i style="width:80%"></i></div><span class="unc-outcome">× 誤り</span><small class="exp-case-state">自動回答</small></div><div class="exp-case" data-confidence="0.75" data-correct="1"><strong>写真7</strong><span>確信度75%</span><div class="unc-confidence" aria-hidden="true"><i style="width:75%"></i></div><span class="unc-outcome">○ 正解</span><small class="exp-case-state">自動回答</small></div><div class="exp-case" data-confidence="0.65" data-correct="0"><strong>写真8</strong><span>確信度65%</span><div class="unc-confidence" aria-hidden="true"><i style="width:65%"></i></div><span class="unc-outcome">× 誤り</span><small class="exp-case-state">自動回答</small></div><div class="exp-case" data-confidence="0.6" data-correct="1"><strong>写真9</strong><span>確信度60%</span><div class="unc-confidence" aria-hidden="true"><i style="width:60%"></i></div><span class="unc-outcome">○ 正解</span><small class="exp-case-state">自動回答</small></div><div class="exp-case" data-confidence="0.55" data-correct="0"><strong>写真10</strong><span>確信度55%</span><div class="unc-confidence" aria-hidden="true"><i style="width:55%"></i></div><span class="unc-outcome">× 誤り</span><small class="exp-case-state">自動回答</small></div></div><p class="unc-accepted-empty" hidden>自動回答はありません。</p></div><div class="unc-tray unc-hold-tray"><h3>人の確認へ回す <span class="unc-held-count">0件</span></h3><div class="exp-cases unc-held-cases"></div><p class="unc-held-empty">保留はありません。</p></div></div>
<p class="unc-observation">10件すべてに答えると、4件の誤りもそのまま返します。</p>
<p class="exp-result unc-sr-only" role="status" aria-live="polite">自動回答10/10件（100%）・その中の誤り率40%。保留0件。</p>
<figcaption>架空の10件を、確信度の高い順に並べています。○正解・×誤りは、後から正解と照合した評価結果です。実際に振り分ける時点では分からず、選択には確信度だけを使います。保留した写真が正解になるわけではありません。</figcaption></figure>
