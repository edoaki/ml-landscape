<figure class="unc-figure"><p class="unc-title">同じ「分からない」でも、原因が違う</p><div class="unc-panels"><div class="unc-panel"><svg viewBox="0 0 200 150" role="img" aria-label="輪郭がぼけた猫の模式図"><defs><filter id="unc-blur"><feGaussianBlur stdDeviation="7"/></filter></defs><rect x="0" y="0" width="200" height="150" rx="10" fill="#f3eee4"/><g filter="url(#unc-blur)"><path d="M55 65 L49 26 L79 44 Q100 35 121 44 L151 26 L145 65 Q162 115 100 128 Q38 115 55 65" fill="#d4ad7f" stroke="#795a3a" stroke-width="3"/><ellipse cx="78" cy="78" rx="5" ry="7" fill="#243b30"/><ellipse cx="122" cy="78" rx="5" ry="7" fill="#243b30"/><path d="M94 95 L106 95 L100 101 Z M100 101 L91 108 M100 101 L109 108" stroke="#795a3a" fill="#795a3a" stroke-width="2"/></g></svg><h3>画像に手がかりが足りない</h3><p>耳や輪郭がぼけ、犬か猫かを判別しにくい。</p><div class="unc-action">同じぼけ方のデータを増やしても、<br>失われた細部は戻らない</div></div><div class="unc-panel"><svg viewBox="0 0 200 150" role="img" aria-label="夜間の猫の模式図"><rect x="0" y="0" width="200" height="150" rx="10" fill="#213c45"/><g opacity=".8"><path d="M55 65 L49 26 L79 44 Q100 35 121 44 L151 26 L145 65 Q162 115 100 128 Q38 115 55 65" fill="#83aeb0" stroke="#b3c9c5" stroke-width="3"/><ellipse cx="78" cy="78" rx="5" ry="7" fill="#243b30"/><ellipse cx="122" cy="78" rx="5" ry="7" fill="#243b30"/><path d="M94 95 L106 95 L100 101 Z M100 101 L91 108 M100 101 L109 108" stroke="#b3c9c5" fill="#b3c9c5" stroke-width="2"/></g></svg><h3>モデルが十分に学んでいない</h3><p>昼の写真で学習したため、夜の見え方を知らない。</p><div class="unc-action">夜の写真で追加学習すると、<br>知識不足を減らせる場合がある</div></div></div><figcaption>猫の画像を使った模式図。左はデータ由来の曖昧さ、右はモデルの知識不足の例です。実際には二つの原因が重なることもあります。</figcaption></figure>
