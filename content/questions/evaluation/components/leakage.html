<figure class="dq-figure"><p class="dq-title">隣のフレームを、未見のデータとして数えない</p><div class="dq-grid"><div class="dq-panel"><h3>画像ごとに混ぜて分ける</h3><p>訓練</p><div class="dq-frames"><span class="dq-frame dq-a"><b>走行A</b><small>フレーム1</small></span><span class="dq-frame dq-b"><b>走行B</b><small>フレーム1</small></span></div><p>テスト</p><div class="dq-frames"><span class="dq-frame dq-a"><b>走行A</b><small>フレーム2</small></span><span class="dq-frame dq-b"><b>走行B</b><small>フレーム2</small></span></div><p class="dq-answer dq-warn">同じ走行が両方に入る</p></div><div class="dq-panel"><h3>走行記録ごとに分ける</h3><p>訓練</p><div class="dq-frames"><span class="dq-frame dq-a"><b>走行A</b><small>フレーム1</small></span><span class="dq-frame dq-a"><b>走行A</b><small>フレーム2</small></span></div><p>テスト</p><div class="dq-frames"><span class="dq-frame dq-b"><b>走行B</b><small>フレーム1</small></span><span class="dq-frame dq-b"><b>走行B</b><small>フレーム2</small></span></div><p class="dq-answer">別の走行で測れる</p></div></div><figcaption>同じ走行の隣接フレームは、道路や背景がほぼ共通です。「新しい走行での性能」を測るための分割例で、別の地域での性能まで測れるとは限りません。</figcaption></figure>
