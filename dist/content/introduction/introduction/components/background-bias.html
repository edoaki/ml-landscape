<figure class="intro-figure" id="background-demo"><div class="intro-figure-body"><p class="intro-figure-title">同じ猫でも、背景が変わると？</p><p class="intro-figure-intro">学習写真が「猫は室内、犬は屋外」だけだったとします。動物を見る判断と、背景に頼る判断を比べます。</p><div class="intro-bias-controls" hidden><fieldset><legend>動物</legend><button type="button" data-select-animal="cat" aria-pressed="true">猫</button><button type="button" data-select-animal="dog" aria-pressed="false">犬</button></fieldset><fieldset><legend>背景</legend><button type="button" data-select-scene="indoor" aria-pressed="true">室内</button><button type="button" data-select-scene="outdoor" aria-pressed="false">屋外</button></fieldset></div><div class="intro-bias-layout"><div class="intro-bias-input"><svg viewBox="0 0 160 108" role="img" aria-label="室内の猫" data-bias-scene><g data-scene="indoor"><rect width="160" height="108" fill="#f3e6d7"/><path d="M0 84 H160" stroke="#d4bda3" stroke-width="2"/><rect x="118" y="15" width="28" height="34" rx="2" fill="#fffaf2" stroke="#c7ab89" stroke-width="2"/><path d="M132 16v32 M119 32h26" stroke="#c7ab89"/></g><g data-scene="outdoor" style="display:none"><rect width="160" height="108" fill="#e6f0ef"/><path d="M0 72 Q35 58 75 75 Q118 62 160 72 V108 H0z" fill="#b9cd9a"/><circle cx="134" cy="23" r="10" fill="#efd79a"/><path d="M12 91l3-9 4 9 M136 98l4-10 4 10" fill="none" stroke="#6b8750" stroke-width="2"/></g><g data-animal="cat"><path d="M107 87 Q145 88 133 65" fill="none" stroke="#b77e48" stroke-width="9" stroke-linecap="round"/><ellipse cx="81" cy="82" rx="27" ry="16" fill="#d7a66a"/><path d="M53 53 L53 28 L69 40 M84 40 L100 28 L99 57" fill="#d7a66a" stroke="#9b653b" stroke-width="2"/><ellipse cx="77" cy="58" rx="25" ry="21" fill="#d7a66a"/><path d="M64 54 h4 M84 54 h4 M74 64 l4 3 4-3 M57 64 l-15-3 M58 69 l-16 3 M97 64 l14-3 M97 69 l15 3" fill="none" stroke="#503c2b" stroke-width="2.5" stroke-linecap="round"/></g><g data-animal="dog" style="display:none"><path d="M107 86 Q138 81 128 61" fill="none" stroke="#7e604c" stroke-width="9" stroke-linecap="round"/><ellipse cx="82" cy="83" rx="29" ry="15" fill="#ab8870"/><ellipse cx="77" cy="57" rx="24" ry="23" fill="#ab8870"/><ellipse cx="54" cy="58" rx="9" ry="23" fill="#71533f" transform="rotate(14 54 58)"/><ellipse cx="100" cy="58" rx="9" ry="23" fill="#71533f" transform="rotate(-14 100 58)"/><ellipse cx="77" cy="68" rx="15" ry="10" fill="#eadac7"/><path d="M65 53 h3 M86 53 h3 M73 63 q4-3 8 0 l-4 4z" fill="#413326" stroke="#413326" stroke-width="2.5" stroke-linecap="round"/></g></svg><p data-bias-label>入力：室内の猫</p></div><div class="intro-predictions" aria-live="polite" aria-atomic="true"><div><span>動物の姿で見分けた場合</span><strong data-shape-result>猫 · 正解</strong><small>猫の姿なら猫、犬の姿なら犬</small></div><div><span>背景だけに頼った場合</span><strong data-background-result>猫 · 正解</strong><small>室内なら猫、屋外なら犬</small></div></div></div><p class="intro-takeaway" data-bias-explanation>室内の猫では、どちらの判断も正解します。これだけでは、何を手がかりにしたか分かりません。</p><div class="intro-bias-static"><table><caption>背景を変えたときの予測</caption><thead><tr><th>入力</th><th>姿で判断</th><th>背景で判断</th></tr></thead><tbody><tr><td>室内の猫</td><td>猫 ○</td><td>猫 ○</td></tr><tr><td>屋外の猫</td><td>猫 ○</td><td>犬 ×</td></tr><tr><td>室内の犬</td><td>犬 ○</td><td>猫 ×</td></tr><tr><td>屋外の犬</td><td>犬 ○</td><td>犬 ○</td></tr></tbody></table></div></div><figcaption>判断の違いを示す教材用の例です。比較する2つの規則をあらかじめ決めており、実際の画像認識モデルの出力ではありません。動物の姿に注目しても、現実には見間違いが起こります。</figcaption></figure>
