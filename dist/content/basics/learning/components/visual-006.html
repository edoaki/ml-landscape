<p class="lf-step"><span>1</span>同じ画像でも、教える情報の細かさが違う</p>
<div class="lf-split"><div><strong>この例で用意するラベル</strong><div class="lf-sample"><svg class="lf-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="傷のある製品"><rect x="6" y="6" width="228" height="138" rx="10" fill="#edf1f1"/><rect x="35" y="26" width="170" height="98" rx="18" fill="#d3dce0" stroke="#687e89" stroke-width="2"/><circle cx="54" cy="44" r="4" fill="#8c9da5"/><circle cx="186" cy="106" r="4" fill="#8c9da5"/><path d="M90 52 l13 15 -8 9 25 22 m-25 -29 l25 15" fill="none" stroke="#864c30" stroke-width="3" stroke-linecap="round"/></svg><span class="lf-tag ">画像全体：傷あり</span></div><p>「どこに傷があるか」は教えない。</p></div><div><strong>位置まで教える場合</strong><div class="lf-sample"><svg class="lf-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="製品の傷の位置を枠で注釈"><rect x="6" y="6" width="228" height="138" rx="10" fill="#edf1f1"/><rect x="35" y="26" width="170" height="98" rx="18" fill="#d3dce0" stroke="#687e89" stroke-width="2"/><circle cx="54" cy="44" r="4" fill="#8c9da5"/><circle cx="186" cy="106" r="4" fill="#8c9da5"/><path d="M90 52 l13 15 -8 9 25 22 m-25 -29 l25 15" fill="none" stroke="#864c30" stroke-width="3" stroke-linecap="round"/><rect x="80" y="43" width="63" height="64" rx="8" fill="none" stroke="#35664d" stroke-width="3" stroke-dasharray="5 4"/></svg><span class="lf-tag ">画像全体：傷あり ＋ 傷の位置</span></div><p>枠を描くには、追加の注釈作業が必要。</p></div></div>
<p class="lf-step"><span>2</span>「傷あり」と「傷なし」の画像を比べて学ぶ</p>
<div class="lf-samples"><div class="lf-sample"><svg class="lf-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="傷のある製品"><rect x="6" y="6" width="228" height="138" rx="10" fill="#edf1f1"/><rect x="35" y="26" width="170" height="98" rx="18" fill="#d3dce0" stroke="#687e89" stroke-width="2"/><circle cx="54" cy="44" r="4" fill="#8c9da5"/><circle cx="186" cy="106" r="4" fill="#8c9da5"/><path d="M98 52 l13 15 -8 9 25 22 m-25 -29 l25 15" fill="none" stroke="#864c30" stroke-width="3" stroke-linecap="round"/></svg><span class="lf-tag ">傷あり</span></div><div class="lf-sample"><svg class="lf-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img" aria-label="傷のない製品"><rect x="6" y="6" width="228" height="138" rx="10" fill="#edf1f1"/><rect x="35" y="26" width="170" height="98" rx="18" fill="#d3dce0" stroke="#687e89" stroke-width="2"/><circle cx="54" cy="44" r="4" fill="#8c9da5"/><circle cx="186" cy="106" r="4" fill="#8c9da5"/></svg><span class="lf-tag ">傷なし</span></div></div>
<p class="lf-takeaway">画像全体の正解を当てる練習から、傷のある場所を捉える手がかりも得たい。ただし、傷の位置が正しく分かるとは限らない。</p>
</div>
