<figure class="fm-figure" id="fm-grpo-example" aria-label="同じ問題への4回答の報酬1、0、1、0を、グループ平均との差で比較するGRPOの数値例">
<div class="fm-paper fm-question"><b>同じ質問から4回生成</b><br>120円のノート3冊 ＋ 80円の鉛筆1本。合計は？</div>
<div class="fm-grpo-grid">
<div class="fm-candidate fm-positive"><span class="fm-eyebrow">回答A</span><p>120 × 3 = 360<br>360 + 80 = <b>440円</b></p><div class="fm-score">報酬 <b>1</b></div><div class="fm-advantage">平均との差 +0.5<br><strong>A = +1</strong></div></div>
<div class="fm-candidate fm-negative"><span class="fm-eyebrow">回答B</span><p>120 × 3 = 360<br>合計は<b>360円</b></p><div class="fm-score">報酬 <b>0</b></div><div class="fm-advantage">平均との差 −0.5<br><strong>A = −1</strong></div></div>
<div class="fm-candidate fm-positive"><span class="fm-eyebrow">回答C</span><p>120 + 120 + 120<br>+ 80 = <b>440円</b></p><div class="fm-score">報酬 <b>1</b></div><div class="fm-advantage">平均との差 +0.5<br><strong>A = +1</strong></div></div>
<div class="fm-candidate fm-negative"><span class="fm-eyebrow">回答D</span><p>120 + 80 = 200<br>200 × 3 = <b>600円</b></p><div class="fm-score">報酬 <b>0</b></div><div class="fm-advantage">平均との差 −0.5<br><strong>A = −1</strong></div></div>
</div>
<div class="fm-group-baseline"><b>4回答で基準を共有</b>　平均 0.5 ／ 標準偏差 0.5</div>
<figcaption>教材用の架空例。最終回答が440円なら1点、それ以外は0点としています。正しい二つの解き方をともに高く評価できますが、途中の計算の正しさはこの採点だけでは確認できません。</figcaption></figure>
