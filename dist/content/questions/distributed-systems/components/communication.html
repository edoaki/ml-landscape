<figure class="systems-figure"><div class="figure-scroll" tabindex="0"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" role="img" aria-labelledby="communication-title"><title id="communication-title">計算120msを4分割しても通信と待ち20msで合計50msになる</title><defs><marker id="communication-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c64"/></marker></defs><g font-family="sans-serif"><text x="360" y="32" text-anchor="middle" font-size="19" fill="#243b30">同じ128枚を処理する時間を比べる</text><text x="25" y="88" text-anchor="start" font-size="16" fill="#243b30">1台</text><rect x="110" y="58" width="540" height="48" rx="6" fill="#e6efdf" stroke="#94ab91"/><text x="380.0" y="87.0" text-anchor="middle" font-size="15" fill="#243b30">計算 120 ms</text><text x="25" y="170" text-anchor="start" font-size="16" fill="#243b30">4台</text><rect x="110" y="140" width="135" height="48" rx="6" fill="#e6efdf" stroke="#94ab91"/><text x="177.5" y="169.0" text-anchor="middle" font-size="15" fill="#243b30">計算 30 ms</text><rect x="245" y="140" width="90" height="48" rx="6" fill="#f2e3d4" stroke="#94ab91"/><text x="290.0" y="169.0" text-anchor="middle" font-size="15" fill="#243b30">20 ms</text><text x="390" y="171" text-anchor="start" font-size="17" fill="#243b30">合計 50 ms</text><path d="M290,219 L290,191" fill="none" stroke="#527c64" stroke-width="2" marker-end="url(#communication-arrow)"/><text x="290" y="244" text-anchor="middle" font-size="14" fill="#243b30">通信・待ち</text><text x="360" y="290" text-anchor="middle" font-size="17" fill="#243b30">計算は1/4でも、全体では 120 ÷ 50 ＝ 2.4倍の速さ</text></g></svg></div><figcaption>説明用の仮定で、実機の測定値ではない。計算と通信を重ねない場合を示す。</figcaption></figure>
