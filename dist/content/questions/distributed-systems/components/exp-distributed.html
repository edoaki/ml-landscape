<figure class="exp-demo exp-stepper" aria-label="4台が別の写真を見て、同じモデルを更新する"><p class="exp-title">データ並列の更新手順</p><div class="exp-controls" hidden><button type="button" data-exp="prev">前へ</button><button type="button" data-exp="next">次へ</button><button type="button" data-exp="reset">最初へ</button><span class="exp-counter" role="status" aria-live="polite"></span></div><div class="exp-stages"><div class="exp-stage"><p class="exp-stage-title">1. 同じ重みで開始</p><div class="exp-tiles"><div class="exp-tile exp-active">GPU 1：32枚</div><div class="exp-tile exp-active">GPU 2：32枚</div><div class="exp-tile exp-active">GPU 3：32枚</div><div class="exp-tile exp-active">GPU 4：32枚</div></div><p>写真は重複しないように分担します。各GPUは同じ重みから計算します。</p></div><div class="exp-stage"><p class="exp-stage-title">2. それぞれ勾配を計算</p><div class="exp-tiles"><div class="exp-tile exp-active">勾配：2</div><div class="exp-tile exp-active">勾配：4</div><div class="exp-tile exp-active">勾配：6</div><div class="exp-tile exp-active">勾配：8</div></div><p>図では勾配の一成分だけを示します。GPUごとの結果をまだ別々に更新へ使いません。</p></div><div class="exp-stage"><p class="exp-stage-title">3. 勾配を平均して交換</p><div class="exp-tiles"><div class="exp-tile exp-active">平均：5</div><div class="exp-tile exp-active">平均：5</div><div class="exp-tile exp-active">平均：5</div><div class="exp-tile exp-active">平均：5</div></div><p>（2＋4＋6＋8）÷4＝5。全GPUが同じ平均勾配を持ちます。</p></div><div class="exp-stage"><p class="exp-stage-title">4. 同じ値で重みを更新</p><div class="exp-tiles"><div class="exp-tile exp-active">新しい重み：0.5</div><div class="exp-tile exp-active">新しい重み：0.5</div><div class="exp-tile exp-active">新しい重み：0.5</div><div class="exp-tile exp-active">新しい重み：0.5</div></div><p>初期の重み1、学習率0.1なら、1−0.1×5＝0.5。次の写真群でも同じモデルから始められます。</p></div></div><figcaption>同期データ並列の模式図。勾配の値は架空で、通信やGPUの計算は実行していません。 JavaScript無効時は全段階を表示します。</figcaption></figure>
