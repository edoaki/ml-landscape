<figure class="exp-demo exp-stepper" aria-label="新製品を覚えた後、旧製品の精度も見る"><p class="exp-title">新旧課題の精度比較</p><div class="exp-controls" hidden><button type="button" data-exp="prev">前へ</button><button type="button" data-exp="next">次へ</button><button type="button" data-exp="reset">最初へ</button><span class="exp-counter" role="status" aria-live="polite"></span></div><div class="exp-stages"><div class="exp-stage"><p class="exp-stage-title">1. Aの学習後</p><div class="exp-bars"><div><span>旧製品A：90%</span><div class="exp-bar-track"><i style="width:90%"></i></div></div><div><span>新製品B：55%</span><div class="exp-bar-track"><i style="width:55%"></i></div></div></div><p>Aは90%、まだ学んでいないBは55%とした架空の例です。</p></div><div class="exp-stage"><p class="exp-stage-title">2. Bだけで追加学習</p><div class="exp-bars"><div><span>旧製品A：60%</span><div class="exp-bar-track"><i style="width:60%"></i></div></div><div><span>新製品B：90%</span><div class="exp-bar-track"><i style="width:90%"></i></div></div></div><p>Bが向上しても、Aは30ポイント低下しました。新しい課題だけの評価では見逃します。</p></div><div class="exp-stage"><p class="exp-stage-title">3. 別の学習：Aも混ぜて復習</p><div class="exp-bars"><div><span>旧製品A：85%</span><div class="exp-bar-track"><i style="width:85%"></i></div></div><div><span>新製品B：88%</span><div class="exp-bar-track"><i style="width:88%"></i></div></div></div><p>段階1のモデルから、BとAの一部を混ぜて学んだ別の結果です。段階2からさらに更新した結果ではありません。</p></div></div><figcaption>正解率は仕組みを示すための架空の値。復習による改善の幅を保証する図ではありません。 JavaScript無効時は全段階を表示します。</figcaption></figure>
