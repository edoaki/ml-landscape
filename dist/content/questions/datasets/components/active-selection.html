<figure class="dq-figure"><p class="dq-title">4枚のうち、1枚だけ人に確認できるなら</p><p class="dq-intro">モデルが出した「傷あり」の確率（架空の値）</p><div class="dq-grid"><div class="dq-panel"><h3>写真A</h3><svg viewBox="0 0 240 140" role="img" aria-label="傷のある製品"><rect x="0" y="0" width="240" height="140" rx="8" fill="#eef0eb"/><rect x="35" y="25" width="170" height="90" rx="13" fill="#c1ccc4" stroke="#70877a" stroke-width="2"/><path d="M132 51 L147 62 L137 73 L153 84" fill="none" stroke="#744c38" stroke-width="4"/></svg><div class="dq-bar-row"><p>傷あり 98%</p><div class="dq-track"><i class="" style="width:98%"></i></div></div><p>どちらかに予測が偏っている</p></div><div class="dq-panel"><h3>写真B</h3><svg viewBox="0 0 240 140" role="img" aria-label="傷が見えない製品"><rect x="0" y="0" width="240" height="140" rx="8" fill="#eef0eb"/><rect x="35" y="25" width="170" height="90" rx="13" fill="#c1ccc4" stroke="#70877a" stroke-width="2"/></svg><div class="dq-bar-row"><p>傷あり 5%</p><div class="dq-track"><i class="" style="width:5%"></i></div></div><p>どちらかに予測が偏っている</p></div><div class="dq-panel"><h3>写真C</h3><svg viewBox="0 0 240 140" role="img" aria-label="傷のある製品"><rect x="0" y="0" width="240" height="140" rx="8" fill="#293c3e"/><rect x="35" y="25" width="170" height="90" rx="13" fill="#82988b" stroke="#70877a" stroke-width="2"/><path d="M132 51 L147 62 L137 73 L153 84" fill="none" stroke="#543c2f" stroke-width="4"/></svg><div class="dq-bar-row"><p>傷あり 51%</p><div class="dq-track"><i class="dq-orange" style="width:51%"></i></div></div><p class="dq-answer">候補：あり／なしで迷う</p></div><div class="dq-panel"><h3>写真D</h3><svg viewBox="0 0 240 140" role="img" aria-label="傷のある製品"><rect x="0" y="0" width="240" height="140" rx="8" fill="#eef0eb"/><rect x="35" y="25" width="170" height="90" rx="13" fill="#c1ccc4" stroke="#70877a" stroke-width="2"/><path d="M88 48 L100 65 L90 78 L105 91" fill="none" stroke="#744c38" stroke-width="4"/></svg><div class="dq-bar-row"><p>傷あり 93%</p><div class="dq-track"><i class="" style="width:93%"></i></div></div><p>どちらかに予測が偏っている</p></div></div><div class="dq-sequence"><p><b>① 選ぶ</b><br>写真Cを確認対象にする</p><span aria-hidden="true">→</span><p><b>② 人が注釈</b><br>基準に沿って「傷あり」</p><span aria-hidden="true">→</span><p><b>③ 再学習</b><br>Cとラベルを訓練へ追加</p></div><figcaption>二値分類で50%に近い例を選ぶ単純な模式例です。51%は実際の正解率を保証しません。高い確率で誤る例や、多様な例を集める必要性は、この選び方だけでは扱えません。</figcaption></figure>
