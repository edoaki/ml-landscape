<figure class="dq-figure"><p class="dq-title">加工後にも、「傷あり」は正しいか</p><div class="dq-grid"><div class="dq-panel"><h3>元の写真</h3><svg viewBox="0 0 240 140" role="img" aria-label="傷のある製品"><rect x="0" y="0" width="240" height="140" rx="8" fill="#eef0eb"/><rect x="35" y="25" width="170" height="90" rx="13" fill="#c1ccc4" stroke="#70877a" stroke-width="2"/><path d="M132 51 L147 62 L137 73 L153 84" fill="none" stroke="#744c38" stroke-width="4"/></svg><p class="dq-answer">傷あり</p></div><div class="dq-panel"><h3>明るさを変える</h3><svg viewBox="0 0 240 140" role="img" aria-label="傷のある製品"><rect x="0" y="0" width="240" height="140" rx="8" fill="#293c3e"/><rect x="35" y="25" width="170" height="90" rx="13" fill="#82988b" stroke="#70877a" stroke-width="2"/><path d="M132 51 L147 62 L137 73 L153 84" fill="none" stroke="#543c2f" stroke-width="4"/></svg><p class="dq-answer">傷は残っている</p><p>傷を確認できる範囲なら、同じラベルを使える。</p></div><div class="dq-panel"><h3>傷を切り落とす</h3><svg viewBox="0 0 240 140" role="img" aria-label="右側の傷が切り落とされた製品"><rect x="0" y="0" width="240" height="140" rx="8" fill="#eef0eb"/><rect x="35" y="25" width="170" height="90" rx="13" fill="#c1ccc4" stroke="#70877a" stroke-width="2"/><path d="M103 12 V128" stroke="#ba592c" stroke-dasharray="5 3" stroke-width="2"/><rect x="110" y="0" width="130" height="140" fill="#fff" opacity=".94"/></svg><p class="dq-answer dq-warn">「傷あり」のままでは不整合</p><p>この分類タスクでは加工やラベルを見直す。</p></div></div><figcaption>教材用の模式図。拡張前に製品単位で訓練・評価を分け、訓練側で加工します。合成データの場合も、画像とラベルの一致や現実との差を点検します。</figcaption></figure>
