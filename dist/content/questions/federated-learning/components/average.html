<figure class="fed-figure" aria-labelledby="fed-average-title"><div class="fed-inner"><strong class="fed-title" id="fed-average-title">図3　100件を、20件・30件・50件に分けて考える</strong><p>帯の長さは、各工場のデータ件数の割合です。</p><div class="fed-share" aria-label="工場A 20%、工場B 30%、工場C 50%"><span>A：20%</span><span>B：30%</span><span>C：50%</span></div><div class="fed-calculation"><div><b>工場A</b><br>重み1.0 × 20%<br>＝ 0.2</div><span>＋</span><div><b>工場B</b><br>重み2.0 × 30%<br>＝ 0.6</div><span>＋</span><div><b>工場C</b><br>重み3.0 × 50%<br>＝ 1.5</div></div><div class="fed-arrow">↓ 足し合わせる</div><div class="fed-node fed-server"><b>共通モデルの新しい重み：2.3</b><br>0.2 ＋ 0.6 ＋ 1.5 ＝ 2.3</div></div><figcaption>各工場を同じ割合で平均すると2.0ですが、この例は件数に比例した平均なので、記録が多い工場Cの3.0をより強く反映して2.3になります。モデル全体では、対応する重みごとにこの計算をします。</figcaption></figure>
