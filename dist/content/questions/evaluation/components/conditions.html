<figure class="dq-figure"><p class="dq-title">全体の点数には、よく出る条件が強く反映される</p><div class="dq-grid"><div class="dq-panel"><h3>昼：歩行者あり900枚</h3><div class="dq-bar-row"><p>見つけた882 / 900枚 = 98%</p><div class="dq-track"><i class="" style="width:98%"></i></div></div><p>昼の画像が全体の9割。</p></div><div class="dq-panel"><h3>夜：歩行者あり100枚</h3><div class="dq-bar-row"><p>見つけた50 / 100枚 = 50%</p><div class="dq-track"><i class="dq-orange" style="width:50%"></i></div></div><p>夜は半分を見逃している。</p></div></div><div class="dq-total">全体の再現率： (882 + 50) / (900 + 100) = <strong>93.2%</strong></div><figcaption>架空の数値例。全体では高い再現率でも、夜に使えるとは判断できません。ここでは再現率を測るため、実際に歩行者がいる画像に注目しています。</figcaption></figure>
