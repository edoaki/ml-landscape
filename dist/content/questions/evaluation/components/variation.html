<figure class="dq-figure"><p class="dq-title">1回だけの最高値と、繰り返した結果を分ける</p><div class="dq-grid"><div class="dq-panel"><h3>モデルA</h3><svg viewBox="0 0 350 185" role="img" aria-label="モデルAの再現率：82%、90%、83%"><path d="M40 140 H300" stroke="#81918a"/><circle cx="92" cy="42" r="6" fill="#4d7897"/><text x="104" y="47">82%</text><circle cx="300" cy="74" r="6" fill="#4d7897"/><text x="312" y="79">90%</text><circle cx="118" cy="106" r="6" fill="#4d7897"/><text x="130" y="111">83%</text><text x="40" y="160" text-anchor="middle">80</text><text x="170" y="160" text-anchor="middle">85</text><text x="300" y="160" text-anchor="middle">90</text><text x="170" y="180" text-anchor="middle">再現率（%）</text></svg><p class="dq-answer">平均85% ／ 範囲82〜90%</p></div><div class="dq-panel"><h3>モデルB</h3><svg viewBox="0 0 350 185" role="img" aria-label="モデルBの再現率：86%、85%、87%"><path d="M40 140 H300" stroke="#81918a"/><circle cx="196" cy="42" r="6" fill="#35664d"/><text x="208" y="47">86%</text><circle cx="170" cy="74" r="6" fill="#35664d"/><text x="182" y="79">85%</text><circle cx="222" cy="106" r="6" fill="#35664d"/><text x="234" y="111">87%</text><text x="40" y="160" text-anchor="middle">80</text><text x="170" y="160" text-anchor="middle">85</text><text x="300" y="160" text-anchor="middle">90</text><text x="170" y="180" text-anchor="middle">再現率（%）</text></svg><p class="dq-answer">平均86% ／ 範囲85〜87%</p></div></div><p class="dq-intro">各点は、同じテストデータで測った1回分の学習結果。上から1回目、2回目、3回目です。Aの最高値90%だけでは、Aが優れているとは言えません。</p><figcaption>架空の数値例。学習の乱数設定を変えた3回を示しています。この少数回の結果だけで優劣を確定せず、各回の値と条件を残します。テストデータを変えた場合のばらつきとは区別します。</figcaption></figure>
