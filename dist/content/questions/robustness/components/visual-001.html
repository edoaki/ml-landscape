<figure><div class="figure-scroll"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 305" role="img" aria-label="照明と背景が変わっても、傷ありという正解は同じ" style="font-family:system-ui,sans-serif"><title>照明と背景が変わっても、傷ありという正解は同じ</title><text x="25" y="32" font-size="21" fill="#243b30">変わるのは見え方。見分けたいのは同じ傷。</text><text x="35" y="75" font-size="16" fill="#243b30">工場A：明るい照明</text><rect x="35" y="92" width="180" height="115" rx="8" fill="#edf0e9" stroke="none"/><rect x="80" y="110" width="90" height="78" rx="8" fill="#b9c5c8" stroke="none"/><path d="M107 128 l17 13 -9 10 22 19" fill="none" stroke="#283e46" stroke-width="3"/><text x="70" y="236" font-size="17" fill="#243b30">正解：傷あり</text><text x="275" y="75" font-size="16" fill="#243b30">工場B：暗い照明</text><rect x="275" y="92" width="180" height="115" rx="8" fill="#4c575e" stroke="none"/><rect x="320" y="110" width="90" height="78" rx="8" fill="#717d80" stroke="none"/><path d="M347 128 l17 13 -9 10 22 19" fill="none" stroke="#283e46" stroke-width="3"/><text x="310" y="236" font-size="17" fill="#243b30">正解：傷あり</text><text x="515" y="75" font-size="16" fill="#243b30">工場C：違う背景</text><rect x="515" y="92" width="180" height="115" rx="8" fill="#d9e4ef" stroke="none"/><rect x="560" y="110" width="90" height="78" rx="8" fill="#b9c5c8" stroke="none"/><path d="M587 128 l17 13 -9 10 22 19" fill="none" stroke="#283e46" stroke-width="3"/><text x="550" y="236" font-size="17" fill="#243b30">正解：傷あり</text><text x="35" y="280" font-size="18" fill="#243b30">評価すること：各条件の写真で「傷あり」を当てられるか</text></svg></div><figcaption>教材用の模式図。同じ製品でも、照明や背景で画素の値は変わります。画像の見え方を変えるだけでは頑健性は測れず、各条件のデータに対する予測と正解を比較する必要があります。</figcaption></figure>
