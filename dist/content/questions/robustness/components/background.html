<figure><div class="figure-scroll"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 307" role="img" aria-label="背景に頼るルールは、白い台の傷あり製品で誤る" style="font-family:system-ui,sans-serif"><title>背景に頼るルールは、白い台の傷あり製品で誤る</title><text x="25" y="32" font-size="20" fill="#243b30">傷と背景が結び付くと、別の手がかりでも当たってしまう</text><text x="35" y="73" font-size="16" fill="#243b30">学習例①：傷あり</text><rect x="35" y="90" width="180" height="115" rx="8" fill="#4c575e" stroke="none"/><rect x="80" y="108" width="90" height="78" rx="8" fill="#b9c5c8" stroke="none"/><path d="M107 126 l17 13 -9 10 22 19" fill="none" stroke="#283e46" stroke-width="3"/><text x="275" y="73" font-size="16" fill="#243b30">学習例②：傷なし</text><rect x="275" y="90" width="180" height="115" rx="8" fill="#edf0e9" stroke="none"/><rect x="320" y="108" width="90" height="78" rx="8" fill="#b9c5c8" stroke="none"/><text x="515" y="73" font-size="16" fill="#243b30">利用時：傷あり</text><rect x="515" y="90" width="180" height="115" rx="8" fill="#edf0e9" stroke="none"/><rect x="560" y="108" width="90" height="78" rx="8" fill="#b9c5c8" stroke="none"/><path d="M587 126 l17 13 -9 10 22 19" fill="none" stroke="#283e46" stroke-width="3"/><text x="35" y="244" font-size="18" fill="#243b30">「黒い台なら傷あり」でも、左の学習例は当たる。</text><text x="35" y="280" font-size="18" fill="#a15a37">右の白い台では、そのルールが「傷なし」と誤る。</text></svg></div><figcaption>教材用の模式図。傷を見るルールと背景を見るルールは、左の2例だけでは区別できません。同じ背景で傷あり・なしの両方を集めることが、背景への依存を減らす手がかりになります。</figcaption></figure>
