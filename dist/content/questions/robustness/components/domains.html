<figure><div class="figure-scroll"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 309" role="img" aria-label="学習用と検証用と最終評価用の工場を分ける" style="font-family:system-ui,sans-serif"><title>学習用と検証用と最終評価用の工場を分ける</title><text x="25" y="32" font-size="19" fill="#243b30">ドメイン＝工場など、データの条件がまとまった環境</text><rect x="25" y="64" width="210" height="140" rx="8" fill="#edf2e8" stroke="none"/><text x="39" y="96" font-size="18" fill="#243b30">学習：工場A・B</text><text x="39" y="136" font-size="16" fill="#243b30">写真 ＋ 正解</text><text x="39" y="166" font-size="16" fill="#243b30">モデルの重みを更新</text><rect x="255" y="64" width="210" height="140" rx="8" fill="#eaf0f6" stroke="none"/><text x="269" y="96" font-size="18" fill="#243b30">検証：別の工場D</text><text x="269" y="136" font-size="16" fill="#243b30">写真 ＋ 正解</text><text x="269" y="166" font-size="16" fill="#243b30">学習方法・設定を選ぶ</text><rect x="485" y="64" width="210" height="140" rx="8" fill="#f7ede4" stroke="none"/><text x="499" y="96" font-size="18" fill="#243b30">最終評価：工場C</text><text x="499" y="136" font-size="16" fill="#243b30">写真 → 予測</text><text x="499" y="166" font-size="16" fill="#243b30">正解と比較して集計</text><text x="30" y="245" font-size="18" fill="#243b30">A・Bで学習 → Dで方法を選択 → モデルを固定 → Cで評価</text><text x="30" y="281" font-size="18" fill="#a15a37">Cの写真・正解を、学習や設定選びに戻さない。</text></svg></div><figcaption>複数の工場を使うドメイン汎化の評価設計例。Cの写真は予測する入力として使い、モデルの調整には使いません。Cのデータを使って学習し直す場合は、ドメイン適応として評価条件を区別します。</figcaption></figure>
