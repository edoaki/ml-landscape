<figure class="learning-demo" id="agents-demo" aria-labelledby="agents-title">
 <div class="ld-body">
  <p class="ld-eyebrow">相手の行動で、自分の行動の結果も変わる</p>
  <strong class="ld-title" id="agents-title">二台で荷物を右の台へ運ぶ</strong>
  <svg viewBox="0 0 520 300" role="img" aria-labelledby="agents-svg-title agents-svg-desc">
   <title id="agents-svg-title">上から見た二台のロボットと荷物</title><desc id="agents-svg-desc">左のAとBが荷物の両端を持つ。右の台まで二台が足並みをそろえて動く必要がある。</desc>
   <rect x="345" y="50" width="150" height="220" rx="12" fill="#e9f0e4" stroke="#a9bea5"/>
   <text x="420" y="35" text-anchor="middle" fill="#365940" font-size="19">運び先の台</text>
   <path d="M180 150H310m-15-10 15 10-15 10" stroke="#acb9a8" fill="none" stroke-width="3"/>
   <line data-load x1="100" y1="90" x2="100" y2="230" stroke="#c79763" stroke-width="28" stroke-linecap="round"/>
   <g data-robot="A" transform="translate(100 90)"><circle r="27" fill="#35664d"/><text text-anchor="middle" y="7" font-size="22" fill="white">A</text></g>
   <g data-robot="B" transform="translate(100 230)"><circle r="27" fill="#537f9b"/><text text-anchor="middle" y="7" font-size="22" fill="white">B</text></g>
   <text x="100" y="35" text-anchor="middle" fill="#365940" font-size="19">出発位置</text>
  </svg>
  <p class="ld-status" role="status">出発位置：AもBも待っています。茶色の棒は荷物です。</p>
  <div class="ld-controls" hidden><button type="button" data-move="alone">Aだけ進む</button><button type="button" data-move="together">AとBが一緒に進む</button><button type="button" data-reset>出発位置に戻す</button></div>
 </div>
 <figcaption>上から見た模式図。「Aだけ」では荷物の向きが斜めになり、「一緒」では向きを保って台まで移動します。荷物・把持部の変形などは省略し、共同の行動が結果を変えることだけを示しています。各ボタンは出発位置からの別の選択を比較します。</figcaption>
 <noscript>Aだけ進むと片端だけが前へ出ます。二台がそろって進めば、荷物の向きを保てます。</noscript>
</figure>
