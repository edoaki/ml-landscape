<div class="lesson-visual" role="group" aria-label="単語が似ていても、文章の意味は変わる"><p class="lv-title">単語が似ていても、文章の意味は変わる</p><div class="lv-grid"><div class="lv-card "><span class="lv-label">否定の掛かり方</span>「映像は美しいが、物語は<strong>面白くなかった</strong>。」<p>「美しい」「面白い」という語だけでは、作品全体への評価を決められない。</p></div><div class="lv-card "><span class="lv-label">言い換えても評価を保つ</span>「見た目はよいが、話は<strong>楽しめなかった</strong>。」<p>語の一致より、何を褒め、何を否定しているかが大切。</p></div><div class="lv-card "><span class="lv-label">まだ決まっていないこと</span>原文：「利用状況を調べ、継続するか判断する。」<p>要約：「継続するかは今後決める。」</p></div><div class="lv-card lv-warn"><span class="lv-label">流暢でも誤った要約</span>「開館時間の延長を<strong>正式に継続すると決めた</strong>。」<p>判断前の計画を、決定済みの事実に変えてしまっている。</p></div></div><p class="lv-caption">文章・出力は教材用の架空の例です。実モデルの実行結果ではありません。</p></div>
