<figure class="exp-demo exp-stepper" aria-label="二回動いて配送する：目先の点数と合計"><p class="exp-title">配送の報酬と累積報酬</p><div class="exp-controls" hidden><button type="button" data-exp="prev">前へ</button><button type="button" data-exp="next">次へ</button><button type="button" data-exp="reset">最初へ</button><span class="exp-counter" role="status" aria-live="polite"></span></div><div class="exp-stages"><div class="exp-stage"><p class="exp-stage-title">1. 出発前</p><div class="exp-tiles"><div class="exp-tile exp-active">出発：ロボット</div><div class="exp-tile">途中</div><div class="exp-tile">届け先</div></div><p>まだ報酬は0。ここから届け先へ向かう方策を考えます。</p></div><div class="exp-stage"><p class="exp-stage-title">2. 一回移動</p><div class="exp-tiles"><div class="exp-tile">出発</div><div class="exp-tile exp-active">途中：ロボット</div><div class="exp-tile">届け先</div></div><p>移動の報酬は−1。ここまでの合計は−1です。移動だけを見れば負担があります。</p></div><div class="exp-stage"><p class="exp-stage-title">3. 二回目の移動で到着</p><div class="exp-tiles"><div class="exp-tile">出発</div><div class="exp-tile">途中</div><div class="exp-tile exp-active">届け先：ロボット</div></div><p>移動−1と配送成功+10で、この段階は+9。全体の合計は−1−1+10＝8です。</p></div></div><figcaption>教材用の決めた経路と報酬。割引なしで計算し、方策の学習は実行していません。 JavaScript無効時は全段階を表示します。</figcaption></figure>
