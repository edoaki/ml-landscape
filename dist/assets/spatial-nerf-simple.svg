<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title"><title id="title">NeRF：複数の写真からNNが場面を学び、新しい視点の画像を描く</title><rect width="760" height="300" rx="18" fill="#fafbf8"/><g font-family="sans-serif" fill="#263c34"><defs><radialGradient id="ball" cx="32%" cy="28%"><stop stop-color="#ffd89b"/><stop offset="1" stop-color="#bd542c"/></radialGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#527765"/></marker></defs><text x="182" y="37" text-anchor="middle" font-size="23" font-weight="bold">いろいろな角度の写真</text><g fill="#fff" stroke="#9eafa5" stroke-width="2"><rect x="30" y="82" width="94" height="108" rx="5"/><rect x="136" y="65" width="94" height="108" rx="5"/><rect x="242" y="82" width="94" height="108" rx="5"/></g><g fill="url(#ball)"><circle cx="77" cy="132" r="31"/><circle cx="183" cy="115" r="31"/><circle cx="289" cy="132" r="31"/></g><g fill="#476f83"><ellipse cx="88" cy="137" rx="8" ry="12"/><ellipse cx="179" cy="120" rx="10" ry="12"/><ellipse cx="270" cy="137" rx="5" ry="12"/></g><path d="M352 130 H438" stroke="#527765" stroke-width="3" marker-end="url(#arrow)"/><text x="395" y="105" text-anchor="middle" font-size="20">学習</text><rect x="458" y="61" width="267" height="139" rx="14" fill="#e8f0eb" stroke="#91ad9d"/><text x="591" y="103" text-anchor="middle" font-size="25" font-weight="bold">場面を覚えたNN</text><text x="591" y="142" text-anchor="middle" font-size="21">場所・見る方向に応じた</text><text x="591" y="174" text-anchor="middle" font-size="21">色や密度を返す</text><text x="380" y="254" text-anchor="middle" font-size="23" font-weight="bold">→ カメラの位置を変えて、撮っていない視点も描ける</text></g></svg>