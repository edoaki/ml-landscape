<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">座標を入力する関数で球を表す</title><desc id="desc">単位球の例。関数f(x,y,z)=x²+y²+z²−1は中心で−1、表面で0、外側で正の値を返す。左は球と3つの座標、右はx軸上の関数の値。fが0となる場所を集めると球の表面になる。</desc>
<rect width="960" height="450" fill="#fff"/>
<g font-family="sans-serif" fill="#29483b">
<text x="35" y="42" font-size="23" font-weight="bold">座標を入れると、その場所の値が返る</text>
<text x="35" y="78" font-size="20">例：f(x, y, z) = x² + y² + z² − 1</text>
<circle cx="200" cy="240" r="108" fill="#e6f1ec" stroke="#507b67" stroke-width="2"/>
<ellipse cx="200" cy="240" rx="108" ry="32" fill="none" stroke="#83a290"/>
<ellipse cx="200" cy="240" rx="38" ry="108" fill="none" stroke="#83a290"/>
<path d="M60 240H410M200 355V110M140 300L263 177" stroke="#9aa7a0" stroke-width="1.5" fill="none"/>
<text x="405" y="263" font-size="17">x</text><text x="210" y="121" font-size="17">z</text><text x="265" y="175" font-size="17">y</text>
<g stroke="#fff" stroke-width="3"><circle cx="200" cy="240" r="8" fill="#427bb4"/><circle cx="308" cy="240" r="8" fill="#298252"/><circle cx="362" cy="240" r="8" fill="#cd7043"/></g>
<text x="150" y="290" font-size="16" fill="#427bb4">A (0, 0, 0)</text><text x="255" y="210" font-size="16" fill="#298252">B (1, 0, 0)</text><text x="310" y="320" font-size="16" fill="#cd7043">C (1.5, 0, 0)</text>
<text x="70" y="385" font-size="20">f = 0 になる場所が球の表面</text>
<path d="M500 270H915M520 355V115" stroke="#9aa7a0" stroke-width="2" fill="none"/>
<text x="480" y="118" font-size="16">f の値</text><text x="900" y="295" font-size="16">x</text>
<path d="M520 340 Q715 340 910 182.5" fill="none" stroke="#507b67" stroke-width="3"/>
<circle cx="520" cy="340" r="7" fill="#427bb4"/><circle cx="780" cy="270" r="7" fill="#298252"/><circle cx="910" cy="182" r="7" fill="#cd7043"/>
<text x="540" y="364" font-size="18" fill="#427bb4">A：−1（内側）</text><text x="686" y="248" font-size="18" fill="#298252">B：0（表面）</text><text x="718" y="155" font-size="18" fill="#cd7043">C：1.25（外側）</text>
<text x="580" y="400" font-size="17">y = z = 0 の断面</text>
</g></svg>
