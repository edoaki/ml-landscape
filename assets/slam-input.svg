<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 340" role="img" aria-labelledby="title"><title id="title">入力は移動中の連続したカメラ画像と慣性センサの値。ORB-SLAM3がカメラの位置・向きと周囲の地図を推定する。</title><rect width="770" height="340" rx="15" fill="#fafbf8"/><g font-family="sans-serif" fill="#263c34"><text x="25" y="30" font-size="22" font-weight="bold">入力：移動しながら撮った連続画像</text><g transform="translate(30 50)"><rect width="220" height="120" rx="6" fill="#e6eff1" stroke="#b0beb5"/><path d="M0 120 L100 47 H120 L220 120" fill="#c9ceca"/><path d="M110 62 V78 M110 94 V116" stroke="white" stroke-width="3"/><path d="M15 82 V30 L70 45 V86 Z" fill="#c5d8c8"/><path d="M155 82 V35 L209 20 V91 Z" fill="#ddc8b4"/><text x="110" y="146" text-anchor="middle" font-size="19">フレーム 1</text></g><g transform="translate(275 50)"><rect width="220" height="120" rx="6" fill="#e6eff1" stroke="#b0beb5"/><path d="M0 120 L100 47 H120 L220 120" fill="#c9ceca"/><path d="M110 62 V78 M110 94 V116" stroke="white" stroke-width="3"/><path d="M15 82 V30 L58 45 V86 Z" fill="#c5d8c8"/><path d="M167 82 V35 L209 20 V91 Z" fill="#ddc8b4"/><text x="110" y="146" text-anchor="middle" font-size="19">フレーム 2</text></g><g transform="translate(520 50)"><rect width="220" height="120" rx="6" fill="#e6eff1" stroke="#b0beb5"/><path d="M0 120 L100 47 H120 L220 120" fill="#c9ceca"/><path d="M110 62 V78 M110 94 V116" stroke="white" stroke-width="3"/><path d="M15 82 V30 L46 45 V86 Z" fill="#c5d8c8"/><path d="M179 82 V35 L209 20 V91 Z" fill="#ddc8b4"/><text x="110" y="146" text-anchor="middle" font-size="19">フレーム 3</text></g><text x="385" y="228" text-anchor="middle" font-size="19">この実験では、左右2台のカメラ画像 ＋ 加速度・角速度</text><path d="M385 242 V265 M376 256 L385 265 L394 256" fill="none" stroke="#527765" stroke-width="3"/><text x="385" y="295" text-anchor="middle" font-size="22" font-weight="bold">ORB-SLAM3 → カメラの位置・向きと周囲の地図</text><text x="385" y="325" text-anchor="middle" font-size="19">下の結果図は、推定したカメラの移動軌跡</text></g></svg>